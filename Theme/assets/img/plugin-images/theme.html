<!doctype html>
<!-- Card image for the Altffour Jellyfin theme (plugins.altffour.com). Edit, then render to
     theme.png (see card.css). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Altffour Theme</title>
<link rel="stylesheet" href="card.css">
<style>
  /* Pink accent from the app's tokens (accents.pink), with a cyan glow behind the glass. */
  :root { --accent: #ff5fa2; --accent-top: #ffb3d3; --deep: #a8336a; --glow: rgba(255, 95, 162, 0.38); --glow-2: rgba(0, 210, 255, 0.28); }
</style>
</head>
<body>
<div class="stage">
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="panel">
    <div class="key">
      <!-- Four small keys, like colour swatches: drawn here from plain shapes. -->
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="6" y="6" width="23" height="23" rx="6" fill="currentColor"/>
        <rect x="35" y="6" width="23" height="23" rx="6" fill="currentColor" fill-opacity="0.7"/>
        <rect x="6" y="35" width="23" height="23" rx="6" fill="currentColor" fill-opacity="0.45"/>
        <rect x="35" y="35" width="23" height="23" rx="6" fill="none" stroke="currentColor" stroke-width="4"/>
      </svg>
    </div>
    <div class="text">
      <p class="brand">ALTFFOUR</p>
      <h1>Theme</h1>
      <p class="line">A Jellyfin web theme in the Altffour look.</p>
    </div>
  </div>
</div>
</body>
</html>
